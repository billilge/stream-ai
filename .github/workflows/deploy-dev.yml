name: Deploy Dev

# main 푸시 → 이미지 빌드·푸시(GHCR) → Coolify 재배포
# 백엔드(stream-server)의 deploy-dev.yml과 같은 방식이다. 같은 Coolify에서 함께 관리하려고 맞췄다.
#
# GHCR: GitHub이 제공하는 도커 이미지 저장소. 빌드한 이미지를 여기 올리면 Coolify가 받아 간다.
# Coolify: 우리 서버에 설치해 쓰는 배포 도구. 이미지를 받아 컨테이너로 띄운다.
#
# 필요한 저장소 Secrets (Coolify 관리자가 넣는다. docs/guides/deploy.md 참고)
#   COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_DEV_UUID
on:
  push:
    branches: [main]

# 연달아 머지되면 앞의 배포를 취소하고 마지막 것만 올린다.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Coolify는 :dev(항상 최신을 가리키는 태그)를 받는다. dev-<커밋> 태그는 되돌릴 때 쓴다.
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --request POST \
            --connect-timeout 10 --max-time 60 \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_DEV_UUID }}&force=true" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --header "Content-Length: 0"
